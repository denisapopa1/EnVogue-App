<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>EnVogue</title>
    <base href="/" />

    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">

    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;700;800&family=Playfair+Display:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css" />
    <link href="EnVogue.styles.css" rel="stylesheet" />

</head>
    <body>
        <div id="app">
            <div class="loading-wrapper-envogue">
                <div class="splash-center-content">
                    <h1 class="envogue-logo-splash">EnVogue</h1>

                    <div class="progress-track">
                        <div class="progress-bar-fill"></div>
                    </div>

                    <div class="spinner-wrapper">
                        <div class="envogue-spinner"></div>
                    </div>

                    <p class="styling-text">STYLING YOUR COLLECTION</p>
                </div>
            </div>
        </div>
        <style>
            html, body {
                background-color: #ffffff !important; /* Sau culoarea ta principală #fce7f3 */
                margin: 0;
                padding: 0;
                /* Dezactivează efectul de "elastic" pe axa Y pentru a preveni banda de culoare */
                overscroll-behavior-y: none;
            }
            .loading-wrapper-envogue {
                position: fixed;
                inset: 0;
                background-color: #ffffff;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 9999;
                font-family: 'Inter', sans-serif;
            }

            .splash-center-content {
                text-align: center;
                width: 100%;
                max-width: 300px;
            }

            .envogue-logo-splash {
                font-family: 'Playfair Display', serif;
                font-size: 52px;
                font-weight: 900;
                font-style: italic;
                color: #1a1a1a;
                margin: 0 0 15px 0;
                letter-spacing: -1px;
            }

            .progress-track {
                width: 200px;
                height: 2px;
                background: #f0f0f0;
                margin: 0 auto 25px;
                position: relative;
                overflow: hidden;
                border-radius: 10px;
            }

            .progress-bar-fill {
                position: absolute;
                left: 0;
                top: 0;
                height: 100%;
                width: 100%;
                background: linear-gradient(to right, #d946ef, #ff7eb9);
                transform-origin: left;
                /* PORNEȘTE INSTANT: Animația rulează cât timp se încarcă fișierele */
                animation: fillIndexFast 3s ease-out forwards;
            }
            .envogue-spinner {
                width: 36px;
                height: 36px;
                border: 3px solid #fff1f2;
                border-top: 3px solid #d946ef;
                border-radius: 50%;
                margin: 0 auto;
                animation: spinAnimIndex 1s linear infinite;
            }

            .styling-text {
                font-size: 10px;
                font-weight: 800;
                letter-spacing: 4px;
                color: #7a5c68;
                text-transform: uppercase;
                margin-top: 20px;
                opacity: 0.7;
            }

            @keyframes spinAnimIndex {
                to {
                    transform: rotate(360deg);
                }
            }
            @keyframes fillIndexFast {
                from {
                    transform: scaleX(0);
                }

                to {
                    transform: scaleX(1);
                }
            }
        </style>

        <script src="_framework/blazor.webassembly.js"></script>
        <script src="fileUploadV2.js"></script>
        <script>
            window.envogueProfile = {
                clickById: function (id) {
                    const element = document.getElementById(id);
                    if (element) {
                        element.click();
                    }
                }
            };

            window.enVogueHome = {
                scrollCarousel: function (element, amount) {
                    if (!element) return;

                    element.scrollBy({
                        left: amount,
                        behavior: 'smooth'
                    });
                }
            };

            window.enVogueNav = {
                goBack: function () {
                    if (window.history.length > 1) {
                        window.history.back();
                        return true;
                    }

                    return false;
                }
            };
        </script>
    </body>
</html>
